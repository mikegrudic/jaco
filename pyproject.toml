[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "jaco"
version = "0.1.1"
authors = [
  { name="Mike Grudić", email="mike.grudic@gmail.com" },
]
description = "object-oriented ISM processes"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
  "jax", "sympy", "numpy", "scipy", "h5py", "astropy", "periodictable"
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
test = ["pytest", "matplotlib"]
docs = ["sphinx", "sphinx_rtd_theme"]

[project.urls]
Homepage = "https://github.com/mikegrudic/jaco"
Issues = "https://github.com/mikegrudic/jaco/issues"

[tool.setuptools.package-data]
"jaco.models.starforge" = ["spcool_tables.hdf5", "data/*"]
"jaco.codegen" = ["*.h"]

[tool.pytest.ini_options]
markers = [
  "slow: takes minutes (e.g. runs the code generator for every model); deselect with -m \"not slow\"",
]
